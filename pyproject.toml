[project]
name = "ada"
version = "0.1.0"
description = "Ada: an AI research scientist who keeps an open, verified dataset of metastatic colorectal cancer trial outcomes."
requires-python = ">=3.11"
dependencies = ["anthropic>=1.0", "pyyaml>=6"]

[project.scripts]
ada = "ada.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ada*"]

[tool.setuptools.package-data]
ada = ["*.yaml"]
