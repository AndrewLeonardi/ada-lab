date: '2026-10-22'
auditor: Claude (Opus 5.5) via Claude Code
summary: 'Audit 2. Published accuracy: 16 of 17 sampled verified numbers correct (one ''randomized'' count was the
  number assessed). The review queue and the 24 consistency contradictions showed systematic errors: counts of treated
  or assessed patients filed as randomized, trial totals under each arm, hazard ratios recorded the wrong way round
  (8), stable disease or landmark rates filed as disease control, an 80% interval as 95%, and medians in days recorded
  as weeks. Fixed with six new code checks and extract-v3.'
