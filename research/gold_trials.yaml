    support: "section 12.3: decline of ultrafiltrable Pt is triphasic, two distribution phases (0.43 h, 16.8 h) and long terminal elimination phase (391 h); Vd 440 L; Cmax 0.814 mcg/mL after 85 mg/m2 over 2 h; no accumulation in ultrafiltrate at 85 mg/m2 q2w"
