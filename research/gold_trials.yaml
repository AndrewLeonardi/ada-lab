  quantity: "PANAMA (AIO KRK 0212): after 6 cycles FU/FA + oxaliplatin + panitumumab, maintenance FU/FA + panitumumab vs FU/FA alone, RAS wt"
  setting: first-line; randomized after response or stable disease to induction; PFS from randomization
  arms:
    - name: FU/FA + panitumumab maintenance
      n: 125
      response_rate_pct: 40.8
      median_pfs_months: 8.8
      median_os_months: 28.7
    - name: FU/FA maintenance
      n: 123
      response_rate_pct: 26.0
      median_pfs_months: 5.7
      median_os_months: 25.7
  hazard_ratios: {pfs: 0.72, pfs_80ci: [0.60, 0.85], pfs_p: 0.014, os: 0.84, os_95ci: [0.60, 1.18], os_p: 0.32, response_odds_ratio: 1.96, response_or_95ci: [1.14, 3.36]}
  source:
    citation: "Modest DP, et al. (2022). Panitumumab Plus Fluorouracil and Folinic Acid Versus Fluorouracil and Folinic Acid Alone as Maintenance Therapy in RAS Wild-Type Metastatic Colorectal Cancer: The Randomized PANAMA Trial (AIO KRK 0212). J Clin Oncol 40:72-82."
    pmid: "34533973"
    doi: "10.1200/JCO.21.01332"
    pmcid: "PMC8683209"
    verified: true
    support: abstract
  confidence: high
  notes: "The PFS HR CI is 80%, as published. Response rate is the objective response during maintenance. The most frequent grade >=3 event in maintenance was skin rash (7.2%)."
