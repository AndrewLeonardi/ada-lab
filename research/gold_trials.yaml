- id: tox_folfox4_neutropenia_g34
  kind: toxicity
  quantity: Grade 3/4 neutropenia, FOLFOX4 (LV5FU2 + oxaliplatin) vs LV5FU2, first-line
  value: 41.7
  low: null
  high: null
  units: percent of patients
  comparator: {regimen: LV5FU2 alone, value: 5.3}
  source:
    citation: "de Gramont A, et al. (2000). Leucovorin and fluorouracil with or without oxaliplatin as first-line treatment in advanced colorectal cancer. J Clin Oncol 18:2938-47."
    pmid: "10944126"
    doi: "10.1200/JCO.2000.18.16.2938"
    verified: true
    support: abstract (NCI-CTC grade 3/4 neutropenia 41.7% vs 5.3%)
  confidence: high
  notes: "The same trial gave grade 3/4 diarrhea in 11.9% vs 5.3%. Grade 3/4 neutropenia counts per-patient over the whole treatment course, not per cycle. Tournigand 2004 says only that grade 3/4 neutropenia was more frequent with FOLFOX6 than with FOLFIRI; its per-arm rates were not available (abstract only)."

