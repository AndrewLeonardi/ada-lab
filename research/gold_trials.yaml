# Metastatic colorectal cancer (mCRC): drug parameters and trial calibration targets
# Compiled 2026-10-18.
#
# Verification conventions
#   verified: true  -> PMID (or label / registry record) checked for title, first author and year,
#                      AND every non-null number in the entry was seen in the abstract, full text,
#                      FDA label text, or ClinicalTrials.gov posted results named in the source block.
#   Any number that could not be seen in a primary or label/registry source is null, and the note
#   says so. Where a commonly cited value is mentioned in a note as "UNVERIFIED", it is there only
#   as a pointer for follow-up and must not be used as a calibration target.
#   Units are as published (PFS in weeks for the panitumumab-vs-BSC trial; months elsewhere unless stated).
#   FDA labels were read from DailyMed SPL XML (current versions as of Oct 2026).
#   ClinicalTrials.gov results were read from the v2 API (posted sponsor results).

# =====================================================================================
# PART 1A. DRUG SCHEDULES
# =====================================================================================

- id: sched_mfolfox6
  kind: drug_schedule
  quantity: mFOLFOX6 regimen (oxaliplatin + leucovorin + bolus/infusional 5-FU)
  setting: first-line mCRC (as protocolized in CALGB/SWOG 80405)
  value: "q14d: oxaliplatin 85 mg/m2 IV over 120 min + leucovorin 400 mg/m2 IV over 2 h, then 5-FU 400 mg/m2 bolus, then 5-FU 2400 mg/m2 over 46-48 h"
  components:
    - {drug: oxaliplatin, dose: 85, units: mg/m2, route: "IV over 120 min", day: 1}
    - {drug: leucovorin, dose: 400, units: mg/m2, route: "IV over 2 h", day: 1}
    - {drug: fluorouracil_bolus, dose: 400, units: mg/m2, route: "IV bolus", day: 1}
    - {drug: fluorouracil_infusion, dose: 2400, units: mg/m2, route: "continuous IV over 46-48 h", day: "1-3"}
  cycle_length_days: 14
  source:
    citation: "Venook AP, et al. (2017). Effect of First-Line Chemotherapy Combined With Cetuximab or Bevacizumab on Overall Survival in Patients With KRAS Wild-Type Advanced or Metastatic Colorectal Cancer: A Randomized Clinical Trial. JAMA 317:2392-2401."
    pmid: "28632865"
    doi: "10.1001/jama.2017.7105"
    pmcid: "PMC5545896"
    verified: true
    support: full text (Methods, PMC) gives the mFOLFOX6 doses exactly as listed
  additional_sources:
    - citation: "Fluorouracil Injection US Prescribing Information (Fresenius Kabi), DailyMed SPL v7, effective 2026-07-15. https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=beb8c6c5-4b6e-4770-b6d4-718e33c7a2ff"
      verified: true
      support: "section 2.3: infusional 5-FU with leucovorin +/- oxaliplatin or irinotecan = 400 mg/m2 bolus day 1 then 2400-3000 mg/m2 continuous infusion over 46 h every 2 weeks"
  confidence: high
  notes: "The paper wording says the 2400 mg/m2 dose was given 'by a 46- to 48-hour infusion' (it calls it a bolus, which is a wording slip; it is the infusion). Leucovorin 400 mg/m2 is racemic (dl) leucovorin; 200 mg/m2 if l-leucovorin (this l/dl equivalence is stated in the Erbitux label CRYSTAL description, see sched_folfiri)."

