  units: hours (terminal, t1/2 gamma)
  phases:
    t_half_alpha_h: 0.43
    t_half_beta_h: 16.8
    t_half_gamma_h: 391
  source:
    citation: "Oxaliplatin Injection US Prescribing Information (Hospira), DailyMed SPL v18, effective 2026-08-07. https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=e51a62ba-d163-4c57-835c-8c86cf097e40"
    pmid: null
